name: Docker Image Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      publish: ${{ steps.publish.outputs.publish_version_tags }}
      release_sha: ${{ steps.autobump.outputs.release_sha || github.sha }}
    permissions:
      contents: write
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auto-cut a patch release for image-relevant merges
        id: autobump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          release_sha="$head"
          bumped=false

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${head}^" >/dev/null 2>&1; then
              base="${head}^"
            else
              base="$head"
            fi
          fi

          # A merge that already chose its own version bump — a deliberate
          # minor/major release, or a dependency branch pinning its own patch
          # — is left alone; only an untouched VERSION gets an automatic bump.
          if [ "$base" = "$head" ] || git diff --quiet "$base" "$head" -- VERSION; then
            image_paths=(Dockerfile requirements.txt midea_mqtt_bridge.py)
            if [ "$base" != "$head" ] && ! git diff --quiet "$base" "$head" -- "${image_paths[@]}"; then
              ./scripts/cut-release.sh

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add VERSION CHANGELOG.md
              git commit -m "chore: release $(tr -d '[:space:]' < VERSION)"
              git push origin HEAD:main

              release_sha="$(git rev-parse HEAD)"
              bumped=true
            fi
          fi

          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Determine whether to publish version tags
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          publish_version_tags=false
          base="${{ github.event.before }}"
          head="${{ github.sha }}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse "${head}^" >/dev/null 2>&1; then
              base="${head}^"
            else
              base="$head"
            fi
          fi

          if [ "$base" != "$head" ] && ! git diff --quiet "$base" "$head" -- VERSION; then
            publish_version_tags=true
          fi

          if [ "${{ steps.autobump.outputs.bumped }}" = "true" ]; then
            publish_version_tags=true
          fi

          echo "publish_version_tags=$publish_version_tags" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "VERSION must be valid SemVer without build metadata: $version" >&2
            exit 1
          fi

          core="${version%%-*}"
          major="${core%%.*}"
          minor="${core%.*}"
          if [ "$version" = "$core" ]; then
            stable=true
          else
            stable=false
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Verify the changelog documents this release
        if: steps.publish.outputs.publish_version_tags == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          escaped="${VERSION//./\\.}"
          if ! grep -qE "^## \\[${escaped}\\]" CHANGELOG.md; then
            {
              echo "CHANGELOG.md has no section for ${VERSION}."
              echo "Move the Unreleased entries into a '## [${VERSION}] - <date>' section before releasing."
            } >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for vulnerability scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.version.outputs.image }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.version.outputs.image }}:scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2

      - name: Print Trivy scan report to job log
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.version.outputs.image }}:scan
          format: table
          ignore-unfixed: true
          vuln-type: 'os,library'
          exit-code: '0'
          skip-setup-trivy: true
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2

      - name: Upload Trivy results to GitHub Security tab
        if: github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publish.outputs.publish_version_tags == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.publish.outputs.publish_version_tags == 'true' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.stable == 'true' && steps.publish.outputs.publish_version_tags == 'true' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.stable == 'true' && steps.publish.outputs.publish_version_tags == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' && steps.publish.outputs.publish_version_tags == 'true' }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publish.outputs.publish_version_tags == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker-image
    if: needs.docker-image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.docker-image.outputs.release_sha }}

      - name: Extract the changelog section for this release
        env:
          VERSION: ${{ needs.docker-image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { collecting = 1; next }
            collecting && /^## \[/ { exit }
            collecting { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No changelog content found for ${VERSION}" >&2
            exit 1
          fi

          # Fuehrende und abschliessende Leerzeilen entfernen.
          sed -i -e '/./,$!d' release-notes.md
          printf '%s\n' "$(cat release-notes.md)" > release-notes.md

          echo "Release notes for ${VERSION}:"
          cat release-notes.md

      - name: Create the git tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.docker-image.outputs.version }}
          STABLE: ${{ needs.docker-image.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; a released version must not be re-tagged." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release ${VERSION}"
          git push origin "$tag"

          args=(--title "$tag" --notes-file release-notes.md)
          if [ "$STABLE" != "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$tag" "${args[@]}"
